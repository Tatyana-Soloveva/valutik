<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valutik — конвертер валют онлайн</title>
    <meta name="description" content="Valutik — конвертер валют онлайн. Актуальные курсы USD, EUR, RUB и других валют. Мгновенный расчёт, без регистрации." />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #0b1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #fff;
            border-radius: 28px;
            padding: 40px 35px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 32px;
            color: #0b2a3b;
            margin-bottom: 4px;
        }
        h1 span {
            color: #1f8b4c;
        }
        .sub {
            color: #5f7d8c;
            font-size: 14px;
            margin-bottom: 28px;
            border-bottom: 2px solid #eef3f7;
            padding-bottom: 18px;
        }
        label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            color: #1f3b4a;
            margin: 16px 0 6px;
        }
        select, input {
            width: 100%;
            padding: 14px 16px;
            font-size: 18px;
            border: 2px solid #dce6ed;
            border-radius: 14px;
            outline: none;
            background: #f8fafc;
            transition: 0.2s;
        }
        select:focus, input:focus {
            border-color: #1f8b4c;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(31, 139, 76, 0.15);
        }
        .btn {
            width: 100%;
            padding: 16px;
            background: #1f8b4c;
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.2s;
        }
        .btn:hover {
            background: #167a3e;
            transform: scale(1.01);
        }
        .result {
            margin-top: 24px;
            background: #f0f7fa;
            border-radius: 18px;
            padding: 20px;
            text-align: center;
            display: none;
            border: 2px solid #d4e4ed;
        }
        .result.show {
            display: block;
        }
        .result .amount {
            font-size: 32px;
            font-weight: 800;
            color: #0b2a3b;
        }
        .result .amount span {
            color: #1f8b4c;
        }
        .footer {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: #a0b8c5;
        }
        .footer a {
            color: #1f8b4c;
            text-decoration: none;
        }
        .partner-link {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }
        .partner-link a {
            color: #1f8b4c;
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💱 Valutik</h1>
        <div class="sub">Конвертер валют онлайн</div>

        <label>💰 Сумма</label>
        <input type="number" id="amount" value="100" step="0.01" />

        <label>📤 Из валюты</label>
        <select id="from">
            <option value="USD">🇺🇸 USD — Доллар США</option>
            <option value="EUR">🇪🇺 EUR — Евро</option>
            <option value="RUB" selected>🇷🇺 RUB — Российский рубль</option>
            <option value="UAH">🇺🇦 UAH — Украинская гривна</option>
            <option value="KZT">🇰🇿 KZT — Казахстанский тенге</option>
            <option value="GBP">🇬🇧 GBP — Фунт стерлингов</option>
        </select>

        <label>📥 В валюту</label>
        <select id="to">
            <option value="USD">🇺🇸 USD — Доллар США</option>
            <option value="EUR">🇪🇺 EUR — Евро</option>
            <option value="RUB">🇷🇺 RUB — Российский рубль</option>
            <option value="UAH" selected>🇺🇦 UAH — Украинская гривна</option>
            <option value="KZT">🇰🇿 KZT — Казахстанский тенге</option>
            <option value="GBP">🇬🇧 GBP — Фунт стерлингов</option>
        </select>

        <button class="btn" id="convertBtn">Конвертировать</button>

        <div class="result" id="resultBlock">
            <div class="amount" id="resultText">100 USD = <span>0</span> RUB</div>
        </div>

        <div class="partner-link">
            🏦 Лучший курс для обмена — <a href="https://ваша-партнёрская-ссылка" target="_blank">здесь</a>
        </div>

        <div class="footer">© 2026 Valutik — быстрый конвертер валют</div>
    </div>

    <script>
        // === API НАСТРОЙКИ ===
        // Бесплатный API: https://www.exchangerate-api.com
        // Замените "ваш_ключ" на реальный ключ
        const API_KEY = 'c8facd03db97d05aa0a1ef99';
        const BASE_URL = `https://v6.exchangerate-api.com/v6/${API_KEY}/latest/USD`;

        async function getRates() {
            try {
                const response = await fetch(BASE_URL);
                if (!response.ok) throw new Error('Ошибка загрузки');
                const data = await response.json();
                return data.conversion_rates;
            } catch (error) {
                alert('Не удалось загрузить курсы. Проверьте интернет или ключ API.');
                return null;
            }
        }

        async function convert() {
            const amount = parseFloat(document.getElementById('amount').value);
            const from = document.getElementById('from').value;
            const to = document.getElementById('to').value;

            if (!amount || amount <= 0) {
                alert('Введите сумму больше 0');
                return;
            }

            const rates = await getRates();
            if (!rates) return;

            const result = (amount / rates[from]) * rates[to];
            const resultBlock = document.getElementById('resultBlock');
            const resultText = document.getElementById('resultText');

            resultText.innerHTML = `${amount} ${from} = <span>${result.toFixed(2)}</span> ${to}`;
            resultBlock.classList.add('show');
        }

        document.getElementById('convertBtn').addEventListener('click', convert);

        // Автоматический расчёт при загрузке
        window.addEventListener('DOMContentLoaded', convert);
    </script>
</body>
</html>
